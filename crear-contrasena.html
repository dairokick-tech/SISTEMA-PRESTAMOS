<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear contraseña | Sistema de Préstamos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px system-ui;background:#f3f6f4;color:#1a2924;max-width:480px;margin:8vh auto;padding:18px}main{background:white;padding:24px;border-radius:16px}label{display:block;margin:12px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #d6e0da;font:inherit}button{background:#123c35;color:white;border:0;margin-top:16px;font-weight:700}.muted{color:#64736c}</style></head><body><main><h1>Crear contraseña</h1><p class="muted">Establece una contraseña segura para acceder a tu financiera.</p><form id="form"><label>Nueva contraseña (mínimo 8 caracteres)</label><input id="pass" type="password" minlength="8" required autocomplete="new-password"><label>Repite la contraseña</label><input id="pass2" type="password" minlength="8" required autocomplete="new-password"><button id="save">Guardar contraseña</button></form><p id="msg" role="status"></p></main><script>const db=supabase.createClient("https://wdaekievxgazzbkjffwc.supabase.co","sb_publishable_Cr_pLYt4CykwT-Z8G-KNcw_GW8bxuMP");const $=x=>document.getElementById(x);db.auth.onAuthStateChange((event)=>{if(event==="PASSWORD_RECOVERY")$("msg").textContent="Enlace válido. Ya puedes guardar tu contraseña."});$("form").onsubmit=async e=>{e.preventDefault();if($("pass").value!==$("pass2").value){$("msg").textContent="Las contraseñas no coinciden.";return}const {data,error}=await db.auth.getSession();if(error||!data.session){$("msg").textContent="El enlace no es válido o ha vencido. Solicita que te envíen otro correo.";return}$("save").disabled=true;const {error:up}=await db.auth.updateUser({password:$("pass").value});if(up){$("msg").textContent="No se pudo guardar: "+up.message;$("save").disabled=false;return}$("msg").textContent="Contraseña creada correctamente. Te llevaremos al panel de acceso.";setTimeout(()=>location.href="https://dairokick-tech.github.io/SISTEMA-PRESTAMOS/panel.html",1200)};</script></body></html>
