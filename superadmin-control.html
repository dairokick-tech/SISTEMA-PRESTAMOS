<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Superadministrador · Sistema de Préstamos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px system-ui;background:#f3f6f4;max-width:900px;margin:24px auto;padding:0 16px;color:#1a2924}section{background:white;padding:20px;border-radius:14px;margin:14px 0}input,button{padding:12px;margin:6px 0;border-radius:8px}button{background:#123c35;color:white;border:0}.hidden{display:none}article{padding:12px 0;border-bottom:1px solid #ddd}</style></head><body><h1>Superadministrador</h1><section id="auth"><form id="login"><label>Correo <input id="email" type="email" required></label><br><label>Contraseña <input id="password" type="password" required></label><br><button>Ingresar</button></form><p id="msg"></p></section><section id="admin" class="hidden"><p id="who"></p><button id="refresh">Actualizar solicitudes</button><button id="logout">Cerrar sesión</button><p id="result"></p><div id="list"></div></section><script>const db=supabase.createClient("https://wdaekievxgazzbkjffwc.supabase.co","sb_publishable_Cr_pLYt4CykwT-Z8G-KNcw_GW8bxuMP");const $=x=>document.getElementById(x);let session;function say(id,t){$(id).textContent=t}function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}async function boot(){const {data}=await db.auth.getSession();session=data.session;if(!session){$("auth").classList.remove("hidden");$("admin").classList.add("hidden");return}const {data:ok,error}=await db.rpc("sp_admin_es_superadmin");if(error||ok!==true){await db.auth.signOut();say("msg","Esta cuenta no está autorizada como Superadministrador.");return}$("auth").classList.add("hidden");$("admin").classList.remove("hidden");say("who","Sesión: "+session.user.email);await load()}async function load(){const {data,error}=await db.rpc("sp_admin_listar_financieras");if(error){say("result","No se pudo cargar: "+error.message);return}const rows=Array.isArray(data)?data:[];$("list").innerHTML=rows.length?rows.map(f=>'<article><b>'+esc(f.nombre)+'</b> · '+esc(f.estado)+'<p>'+esc(f.correo)+' · '+esc(f.ruc)+'</p>'+(f.estado==="pendiente"?'<button data-a="'+esc(f.id)+'">Aprobar y solicitar correo</button> <button data-r="'+esc(f.id)+'">Rechazar</button>':'')+'</article>').join(""):"No hay solicitudes.";document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>decide(b.dataset.a,"aprobar",b));document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>decide(b.dataset.r,"rechazar",b))}async function decide(id,decision,b){b.disabled=true;try{const {data:rows,error:le}=await db.rpc("sp_admin_listar_financieras");if(le)throw le;const f=(rows||[]).find(x=>x.id===id);if(!f)throw Error("Solicitud no encontrada");if(decision==="aprobar"){if(!f.correo)throw Error("Falta correo de contacto");const {error}=await db.auth.resetPasswordForEmail(f.correo,{redirectTo:"https://dairokick-tech.github.io/SISTEMA-PRESTAMOS/crear-contrasena.html"});if(error)throw error}const {error}=await db.rpc("sp_admin_decidir_financiera",{p_financiera_id:id,p_decision:decision});if(error)throw error;say("result",decision==="aprobar"?"Financiera activada. Supabase recibió la solicitud de correo; confirma su entrega.":"Financiera rechazada.");await load()}catch(e){say("result","No se completó: "+e.message)}finally{b.disabled=false}}$("login").onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){say("msg","No se pudo ingresar: "+error.message);return}await boot()};$("refresh").onclick=load;$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};boot();</script></body></html>
