<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operaciones financieras</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:15px system-ui;margin:0;background:#f3f6f4;color:#182923}header{background:#123c35;color:white;padding:16px}main{max-width:1100px;margin:auto;padding:16px}.card{background:white;padding:16px;border-radius:12px;margin:12px 0}button{padding:10px;background:#123c35;color:white;border:0;border-radius:8px}input,select{padding:10px;border:1px solid #ccd8d1;border-radius:8px;width:100%;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{margin:8px 0}.field label{display:block;font-size:12px;font-weight:bold}.nav{display:flex;gap:8px;overflow:auto}.nav button{white-space:nowrap}.sec{display:none}.sec.on{display:block}.notice{padding:12px;background:#edf6ef;margin:8px 0}.err{background:#ffeceb;color:#9a332e}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:550px}td,th{text-align:left;border-bottom:1px solid #ddd;padding:8px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>SISTEMA DE PRÉSTAMOS · Operaciones</b>　<a style="color:white" href="./panel.html">Configuración</a></header><main><section id="loginbox" class="card"><h2>Iniciar sesión</h2><form id="login"><div class="field"><label>Correo</label><input id="email" type="email" required></div><div class="field"><label>Contraseña</label><input id="password" type="password" required></div><button>Ingresar</button><button type="button" id="recoverOps" style="margin-left:8px;background:#eaf2ed;color:#123c35">Olvidé mi contraseña</button></form><div id="loginmsg"></div></section><section id="app" style="display:none"><div class="card"><label>Financiera</label><select id="finance"></select><div id="status" class="notice">Cargando…</div></div><nav class="nav"><button <section id="clients" class="sec on"><div class="card"><h2>Registrar cliente</h2><form id="cf"><div class="grid"><div class="field"><label>Nombres</label><input id="cn" required></div><div class="field"><label>Apellidos</label><input id="ca" required></div><div class="field"><label>Tipo documento</label><select id="ct"><option>DNI</option><option>CE</option><option>RUC</option><option>Pasaporte</option></select></div><div class="field"><label>Número documento</label><input id="cd" required></div><div class="field"><label>Teléfono</label><input id="cp"></div><div class="field"><label>Correo</label><input id="ce" type="email"></div><div class="field"><label>Ocupación</label><input id="cj"></div><div class="field"><label>Dirección</label><input id="caddr"></div></div><button>Guardar cliente</button></form></div><div class="card"><h3>Clientes</h3><div id="clientrows" class="table"></div></div></section>
<section id="products" class="sec"><div class="card"><h2>Nuevo producto de crédito</h2><form id="pf"><div class="grid"><div class="field"><label>Nombre</label><input id="pn" required></div><div class="field"><label>Frecuencia</label><select id="pfr"><option>diaria</option><option selected>semanal</option><option>quincenal</option><option>mensual</option></select></div><div class="field"><label>Tasa por período (%)</label><input id="pr" type="number" min="0" step=".01" value="5" required></div><div class="field"><label>Método</label><select id="pm"><option value="interes_plano">Interés plano</option><option value="saldo_nivelado">Cuota nivelada</option><option value="capital_constante">Capital constante</option></select></div><div class="field"><label>Plazo mínimo</label><input id="pmin" type="number" value="1" min="1"></div><div class="field"><label>Plazo máximo</label><input id="pmax" type="number" value="52" min="1"></div></div><button>Guardar producto</button></form></div><div class="card"><div id="productrows" class="table"></div></div></section>
<section id="loans" class="sec"><div class="card"><h2>Registrar préstamo y cuotas</h2><form id="lf"><div class="grid"><div class="field"><label>Cliente</label><select id="lc" required></select></div><div class="field"><label>Producto</label><select id="lp"></select></div><div class="field"><label>Capital S/</label><input id="la" type="number" min=".01" step=".01" required></div><div class="field"><label>Tasa (%) por cuota</label><input id="lr" type="number" min="0" step=".01" value="5" required></div><div class="field"><label>Frecuencia</label><select id="lfreq"><option value="diaria">Diaria</option><option value="semanal" selected>Semanal</option><option value="quincenal">Quincenal</option><option value="mensual">Mensual</option></select></div><div class="field"><label>Número de cuotas</label><input id="ln" type="number" min="1" max="365" value="12" required></div><div class="field"><label>Método</label><select id="lm"><option value="interes_plano">Interés plano</option><option value="saldo_nivelado">Cuota nivelada</option><option value="capital_constante">Capital constante</option></select></div><div class="field"><label>Primer vencimiento</label><input id="ld" type="date" required></div><div class="field"><label>Destino</label><input id="lwhy"></div></div><button>Guardar préstamo</button></form></div></section>
<section id="payments" class="sec"><div class="card"><h2>Registrar pago</h2><form id="payf"><div class="grid"><div class="field"><label>Préstamo</label><select id="payloan" required></select></div><div class="field"><label>Cuota pendiente</label><select id="payi" required></select></div><div class="field"><label>Monto S/</label><input id="paym" type="number" min=".01" step=".01" required></div><div class="field"><label>Método</label><select id="paymethod"><option value="efectivo">Efectivo</option><option value="transferencia">Transferencia</option><option value="yape">Yape</option><option value="plin">Plin</option><option value="deposito">Depósito</option></select></div><div class="field"><label>Referencia</label><input id="payref"></div></div><div id="due" class="notice"></div><button>Guardar y aplicar pago</button></form></div></section>
<section id="records" class="sec"><div class="card"><h2>Préstamos</h2><div id="loanrows" class="table"></div></div><div class="card"><h2>Cuotas</h2><div id="quotarows" class="table"></div></div><div class="card"><h2>Pagos</h2><div id="paymentrows" class="table"></div></div></section></section></main>
<script>
const db=supabase.createClient("https://wdaekievxgazzbkjffwc.supabase.co","sb_publishable_Cr_pLYt4CykwT-Z8G-KNcw_GW8bxuMP"),$=id=>document.getElementById(id);let u=null,fid=null,C=[],P=[],L=[],Q=[],Y=[];
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),cash=x=>"S/ "+Number(x||0).toFixed(2),say=(s,b=false)=>{$("status").textContent=s;$("status").className="notice"+(b?" err":"")},name=id=>{let c=C.find(x=>x.id===id);return c?c.nombres+" "+c.apellidos:"Cliente"};
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".sec").forEach(s=>s.classList.remove("on"));$(b.dataset.s).classList.add("on")});
$("login").onsubmit=async e=>{e.preventDefault();let r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error){$("loginmsg").textContent="No se pudo ingresar: "+r.error.message+". Verifica tus credenciales o recupera la contraseña.";return}u=r.data.user;await boot()};$("recoverOps").onclick=async()=>{const email=$("email").value.trim();if(!email){$("loginmsg").textContent="Escribe tu correo y vuelve a pulsar Olvidé mi contraseña.";return}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:"https://dairokick-tech.github.io/SISTEMA-PRESTAMOS/crear-contrasena.html"});$("loginmsg").textContent=error?"No se pudo enviar la recuperación: "+error.message:"Si el correo está registrado, recibirás un enlace para crear una contraseña nueva. Revisa Spam.";};$("finance").onchange=()=>{fid=$("finance").value;load()};
function options(id,rows,lab,empty="Seleccionar"){ $(id).innerHTML='<option value="">'+empty+'</option>'+rows.map(x=>'<option value="'+esc(x.id)+'">'+esc(lab(x))+'</option>').join("")}
function daygap(f){return ({diaria:1,semanal:7,quincenal:15,mensual:30})[f]||7}
function render(){ $("clientrows").innerHTML=C.length?'<table><tr><th>Nombre</th><th>Documento</th><th>Teléfono</th></tr>'+C.map(c=>'<tr><td>'+esc(name(c.id))+'</td><td>'+esc(c.tipo_documento+" "+c.numero_documento)+'</td><td>'+esc(c.telefono)+'</td></tr>').join("")+'</table>':"No hay clientes."; $("productrows").innerHTML=P.length?'<table><tr><th>Producto</th><th>Frecuencia</th><th>Tasa</th><th>Plazo</th></tr>'+P.map(p=>'<tr><td>'+esc(p.nombre)+'</td><td>'+esc(p.frecuencia)+'</td><td>'+esc(p.tasa)+'%</td><td>'+p.plazo_minimo+'–'+p.plazo_maximo+'</td></tr>').join("")+'</table>':"No hay productos."; $("loanrows").innerHTML=L.length?'<table><tr><th>Cliente</th><th>Capital</th><th>Estado</th></tr>'+L.map(l=>'<tr><td>'+esc(name(l.cliente_id))+'</td><td>'+cash(l.capital_original)+'</td><td>'+esc(l.estado)+'</td></tr>').join("")+'</table>':"No hay préstamos."; $("quotarows").innerHTML=Q.length?'<table><tr><th>Cliente</th><th>Cuota</th><th>Vence</th><th>Saldo</th><th>Estado</th></tr>'+Q.map(q=>{let l=L.find(x=>x.id===q.prestamo_id),due=+q.capital_programado + +q.interes_programado + +q.mora_programada - +q.capital_pagado - +q.interes_pagado - +q.mora_pagada;return '<tr><td>'+esc(name(l?.cliente_id))+'</td><td>'+q.numero_cuota+'</td><td>'+q.fecha_vencimiento+'</td><td>'+cash(Math.max(0,due))+'</td><td>'+esc(q.estado)+'</td></tr>'}).join("")+'</table>':"No hay cuotas."; $("paymentrows").innerHTML=Y.length?'<table><tr><th>Fecha</th><th>Cliente</th><th>Monto</th><th>Método</th></tr>'+Y.map(y=>'<tr><td>'+esc((y.creado_en||"").slice(0,10))+'</td><td>'+esc(name(y.cliente_id))+'</td><td>'+cash(y.monto)+'</td><td>'+esc(y.metodo_pago)+'</td></tr>').join("")+'</table>':"No hay pagos.";options("lc",C,c=>name(c.id));options("lp",P,p=>p.nombre,"Sin producto");options("payloan",L,l=>name(l.cliente_id)+" · "+cash(l.capital_original));let pending=Q.filter(q=>q.prestamo_id===$("payloan").value&&q.estado!=="pagada");options("payi",pending,q=>"Cuota "+q.numero_cuota+" vence "+q.fecha_vencimiento);$("due").textContent="Saldo: "+cash((()=>{let q=Q.find(q=>q.id===$("payi").value);return q?+q.capital_programado + +q.interes_programado + +q.mora_programada - +q.capital_pagado - +q.interes_pagado - +q.mora_pagada:0})())}
async function load(){if(!fid)return;say("Consultando permisos y datos…");let r=await Promise.all([db.from("sp_clientes").select("*").eq("financiera_id",fid).order("creado_en",{ascending:false}),db.from("sp_productos_credito").select("*").eq("financiera_id",fid),db.from("sp_prestamos").select("*").eq("financiera_id",fid),db.from("sp_cuotas").select("*").eq("financiera_id",fid).order("fecha_vencimiento"),db.from("sp_pagos").select("*").eq("financiera_id",fid).order("creado_en",{ascending:false})]);[C,P,L,Q,Y]=r.map(x=>x.data||[]);let err=r.find(x=>x.error);if(err)say("Hay módulos sin permiso: "+err.error.message,true);else say("Conectado. Puedes registrar clientes, productos, préstamos y pagos.");render()}
$("cf").onsubmit=async e=>{e.preventDefault();let r=await db.from("sp_clientes").insert({financiera_id:fid,nombres:$("cn").value.trim(),apellidos:$("ca").value.trim(),tipo_documento:$("ct").value,numero_documento:$("cd").value.trim(),telefono:$("cp").value.trim()||null,correo:$("ce").value.trim()||null,ocupacion:$("cj").value.trim()||null,direccion:$("caddr").value.trim()||null,estado:"activo",creado_por:u.id});if(r.error)return say("Error cliente: "+r.error.message,true);$("cf").reset();await load();say("Cliente registrado correctamente.")};
$("pf").onsubmit=async e=>{e.preventDefault();let min=+$("pmin").value,max=+$("pmax").value;if(max<min)return say("El plazo máximo no puede ser menor al mínimo.",true);let r=await db.from("sp_productos_credito").insert({financiera_id:fid,nombre:$("pn").value.trim(),frecuencia:$("pfr").value,tipo_tasa:"periodica",tasa:+$("pr").value,metodo_amortizacion:$("pm").value,plazo_minimo:min,plazo_maximo:max,activo:true,mora_config:{}});if(r.error)return say("Error producto: "+r.error.message,true);$("pf").reset();await load();say("Producto guardado.")};
$("lp").onchange=()=>{let p=P.find(p=>p.id===$("lp").value);if(p){$("lr").value=p.tasa;$("lfreq").value=p.frecuencia;$("lm").value=p.metodo_amortizacion;$("ln").min=p.plazo_minimo;$("ln").max=p.plazo_maximo}};
$("lf").onsubmit=async e=>{e.preventDefault();let c=C.find(c=>c.id===$("lc").value),p=P.find(p=>p.id===$("lp").value),a=+$("la").value,rate=+$("lr").value,n=+$("ln").value,freq=$("lfreq").value,method=$("lm").value;if(!c||a<=0||n<1||n>365)return say("Revisa cliente, capital y plazo.",true);if(p&&(n<p.plazo_minimo||n>p.plazo_maximo))return say("El plazo no corresponde al producto seleccionado.",true);let r=rate/100,totalInterest=method==="capital_constante"?a*r*(n+1)/2:a*r*n,total=a+totalInterest,pay=total/n;if(method==="saldo_nivelado"){pay=r===0?a/n:a*r/(1-Math.pow(1+r,-n));total=pay*n;totalInterest=total-a}let ins=await db.from("sp_prestamos").insert({financiera_id:fid,cliente_id:c.id,capital_original:a,tasa_aprobada:rate,tipo_tasa_snapshot:"periodica",metodo_amortizacion_snapshot:method,frecuencia_snapshot:freq,plazo_snapshot:n,condiciones_snapshot:{destino:$("lwhy").value,producto_credito_id:p?.id||null,total_estimado:total},estado:"desembolsado",fecha_aprobacion:new Date().toISOString(),fecha_desembolso:new Date().toISOString(),creado_por:u.id}).select().single();if(ins.error)return say("Error préstamo: "+ins.error.message,true);let capLeft=a,s=[];for(let i=1;i<=n;i++){let cap=i===n?capLeft:Math.round(a/n*100)/100;capLeft-=cap;let interest=method==="saldo_nivelado"?Math.max(0,pay-cap):method==="capital_constante"?Math.max(0,(a-(i-1)*(a/n))*r):a*r;s.push({financiera_id:fid,prestamo_id:ins.data.id,numero_cuota:i,fecha_vencimiento:(()=>{let d=new Date($("ld").value+"T12:00:00");d.setDate(d.getDate()+daygap(freq)*(i-1));return d.toISOString().slice(0,10)})(),capital_programado:cap,interes_programado:Math.round(interest*100)/100,mora_programada:0,capital_pagado:0,interes_pagado:0,mora_pagada:0,estado:"pendiente"})}let sr=await db.from("sp_cuotas").insert(s);if(sr.error)return say("Préstamo guardado pero cronograma falló: "+sr.error.message+". No vuelvas a crear el préstamo; solicita revisión.",true);$("lf").reset();await load();say("Préstamo y cronograma registrados.")};
$("payloan").onchange=()=>{let rows=Q.filter(q=>q.prestamo_id===$("payloan").value&&q.estado!=="pagada");options("payi",rows,q=>"Cuota "+q.numero_cuota+" · "+q.fecha_vencimiento);updateDue()};$("payi").onchange=updateDue;function updateDue(){let q=Q.find(q=>q.id===$("payi").value);$("due").textContent="Saldo: "+cash(q?+q.capital_programado + +q.interes_programado + +q.mora_programado - +q.capital_pagado - +q.interes_pagado - +q.mora_pagada:0)}
$("payf").onsubmit=async e=>{e.preventDefault();let l=L.find(l=>l.id===$("payloan").value),q=Q.find(q=>q.id===$("payi").value),amt=+$("paym").value;if(!l||!q)return say("Selecciona préstamo y cuota.",true);let capDue=Math.max(0,+q.capital_programado- +q.capital_pagado),intDue=Math.max(0,+q.interes_programado- +q.interes_pagado),moraDue=Math.max(0,+q.mora_programado- +q.mora_pagada),due=capDue+intDue+moraDue;if(amt<=0||amt>due+.005)return say("El monto debe estar dentro del saldo "+cash(due),true);let pr=await db.from("sp_pagos").insert({financiera_id:fid,prestamo_id:l.id,cliente_id:l.cliente_id,monto:amt,metodo_pago:$("paymethod").value,referencia:$("payref").value.trim()||null,recibido_por:u.id,estado:"confirmado"}).select().single();if(pr.error)return say("Error pago: "+pr.error.message,true);let rem=amt,cap=Math.min(rem,capDue);rem-=cap;let interest=Math.min(rem,intDue);rem-=interest;let mora=Math.min(rem,moraDue);let ar=await db.from("sp_aplicaciones_pago").insert({financiera_id:fid,pago_id:pr.data.id,cuota_id:q.id,capital:cap,interes,mora});if(ar.error)return say("Pago registrado, pero no aplicado: "+ar.error.message+". No vuelvas a registrar el pago.",true);let cp=+q.capital_pagado+cap,ip=+q.interes_pagado+interest,mp=+q.mora_pagada+mora,done=cp+ip+mp>=+q.capital_programado + +q.interes_programado + +q.mora_programada-.005;let ur=await db.from("sp_cuotas").update({capital_pagado:cp,interes_pagado:ip,mora_pagada:mp,estado:done?"pagada":"pendiente"}).eq("id",q.id).eq("financiera_id",fid);if(ur.error)return say("Pago y aplicación guardados pero no se actualizó cuota: "+ur.error.message+". No repitas el pago.",true);$("payf").reset();await load();say("Pago registrado y aplicado correctamente.")};
async function boot(){let s=await db.auth.getSession();u=s.data.session?.user;if(!u){$("loginbox").style.display="block";$("app").style.display="none";return}let ad=await db.rpc("sp_admin_es_superadmin");if(ad.data===true){location.replace("./superadmin-control.html");return}$("loginbox").style.display="none";$("app").style.display="block";let m=await db.from("sp_miembros").select("financiera_id,activo").eq("usuario_id",u.id).eq("activo",true);if(m.error)return say("No se pudo leer membresía: "+m.error.message,true);let ids=[...new Set((m.data||[]).map(x=>x.financiera_id))];if(!ids.length)return say("Tu cuenta no tiene financiera asignada. Solicita aprobación al Superadministrador.",true);let f=await db.from("sp_financieras").select("id,nombre").in("id",ids).eq("estado","activa");if(f.error||!f.data?.length)return say("No hay financieras activas: "+(f.error?.message||""),true);$("finance").innerHTML=f.data.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.nombre)+'</option>').join("");fid=$("finance").value;await load()}db.auth.onAuthStateChange((e)=>{if(["SIGNED_IN","SIGNED_OUT","TOKEN_REFRESHED"].includes(e))setTimeout(boot,0)});boot();
</script></body></html>
